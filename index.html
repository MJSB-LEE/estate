<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e40af">
<title>Lawatan Ladang</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --blue:#1e40af; --blue-d:#1e3a8a; --blue-l:#eaf0ff; --blue-b:#c7d4fb;
    --ink:#1f2937; --muted:#6b7280; --line:#e3e7ee; --bg:#f7f8fb; --head:#eef1f6;
    --red:#c62828; --amber:#b45309; --green:#15803d;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;display:flex;flex-direction:column}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;font-weight:600}
  input,select,textarea{font:inherit;color:inherit}
  .btn{background:var(--blue);color:#fff}
  .btn:hover{background:var(--blue-d)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--blue-l)}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #f3c6c6}
  .btn-danger:hover{background:#fdecec}
  button:disabled{opacity:.5;cursor:not-allowed}
  .f-in{width:100%;padding:9px 12px;border:1px solid #cfd6e1;border-radius:8px;background:#fff}
  .f-in:focus{outline:2px solid var(--blue);border-color:transparent}
  label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}

  /* Top bar */
  .top{background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex:none}
  .top .logo{background:#fff;border-radius:8px;height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;padding:3px 6px}
  .top .logo img{height:32px}
  .top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap}
  .top .pill.off{background:#fbbf24;color:#3b2500}
  .lang{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden}
  .lang button{padding:3px 10px;border-radius:0;font-size:12px;background:transparent;color:#fff}
  .lang button.on{background:#fff;color:var(--blue)}
  #btnMenu{display:none;background:transparent;color:#fff;font-size:22px;padding:2px 6px}

  /* Shell */
  .shell{flex:1;display:flex;min-height:0}
  .side{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);padding:14px 0;overflow:auto}
  .side .sec{font-size:12px;color:var(--muted);padding:14px 12px 6px;letter-spacing:.5px}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:2px 8px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;border:1px solid transparent}
  .side a:hover{background:#f3f6fb}
  .side a.on{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue);font-weight:600}
  .side .cnt{margin-left:auto;font-size:11px;background:#fde68a;color:#7c4a03;border-radius:999px;padding:1px 7px;font-weight:700}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .tabs{display:flex;gap:4px;padding:10px 14px 0;background:#e9edf4;overflow-x:auto;flex:none}
  .tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px 8px 0 0;background:#f4f6fa;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14px;border:1px solid var(--line);border-bottom:0}
  .tab.on{background:var(--bg);color:var(--ink);font-weight:600}
  .tab .x{color:#9aa3af;font-size:13px;padding:0 2px}
  .tab .x:hover{color:var(--red)}
  .content{flex:1;overflow:auto;padding:18px}
  .page{display:none;max-width:1400px}
  .page.on{display:block}

  @media (max-width:860px){
    #btnMenu{display:block}
    .side{position:fixed;top:60px;bottom:0;left:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.12)}
    .side.open{transform:none}
    .top .pill{font-size:11px;padding:3px 8px}
    .top h1{font-size:14px}
    .content{padding:12px}
  }

  /* Common */
  .bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h2{margin:0 0 12px;font-size:16px}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .stat .n{font-size:28px;font-weight:800;color:var(--blue)}
  .stat .l{font-size:13px;color:var(--muted)}
  .stat.warn .n{color:var(--amber)}

  table.tbl{width:100%;border-collapse:collapse;background:#fff}
  .tbl th{background:var(--head);text-align:left;font-weight:600;font-size:14px;color:#374151;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tr:hover td{background:#fafbfe}
  .tbl .doc{color:var(--red);font-weight:600;cursor:pointer;white-space:nowrap}
  .tbl tbody tr.click{cursor:pointer}
  .tbl tbody tr.click:hover td{background:#eef3ff}
  .tbl .doc:hover{text-decoration:underline}
  .tbl .num{text-align:right}
  .tbl tfoot td{font-weight:700;background:#f8fafc}
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .cnt-btn{border:1px solid #cfd6e1;background:#fff;padding:4px 14px;font-size:13px;border-radius:6px}
  .cnt-btn:hover{background:var(--blue-l)}
  .sub td{background:#fbfcff !important;padding:10px}
  .thumbs{display:flex;gap:10px;flex-wrap:wrap}
  .thumbs figure{margin:0;width:120px}
  .thumbs img{width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
  .thumbs figcaption{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .b-draft{background:#eef0f3;color:var(--muted)}
  .b-pending{background:#fef3c7;color:var(--amber)}
  .b-synced{background:#dcfce7;color:var(--green)}
  .foot{margin-top:12px;color:var(--muted)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* Photos page */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .gal .it{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
  .gal .it:hover{border-color:var(--blue)}
  .gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eef1f6}
  .gal .cap{padding:8px 10px;font-size:13px}
  .gal .cap b{color:var(--red)}

  /* Editor */
  .doc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .doc-head h2{margin:0;font-size:20px}
  .doc-head .docno{color:var(--red)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr} }
  .edcol{display:flex;flex-direction:column;gap:16px}
  .drop{border:2px dashed #cfd6e1;border-radius:10px;padding:16px;text-align:center;color:var(--muted);background:#fafbfe}
  .drop.over{border-color:var(--blue);background:var(--blue-l)}
  .drop .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  #photoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
  .ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .ph-img{position:relative;aspect-ratio:4/3;background:#eef1f6;overflow:hidden}
  .ph-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  /* doc view (like Papan) */
  .doc-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}
  .doc-bar .dn{font-weight:800;color:var(--red);font-size:18px}
  .doc-bar .spacer{flex:1}
  .docview{display:grid;grid-template-columns:minmax(0,620px) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:1100px){ .docview{grid-template-columns:1fr} }
  .sheets{background:#e5e9f0;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px}
  .sheet{background:#fff;aspect-ratio:210/297;container-type:inline-size;box-shadow:0 2px 8px rgba(0,0,0,.12);font-family:Helvetica,Arial,sans-serif;color:#000}
  .sheet-in{position:relative;height:100%;padding:5.5cqw 9.7cqw 9cqw;display:flex;flex-direction:column}
  .sh-head{position:relative;height:16cqw;margin-top:-2cqw}
  .sh-head img{position:absolute;left:0;top:0;max-width:12cqw;max-height:12cqw}
  .sh-rev{position:absolute;right:0;top:0;font-size:1.6cqw}
  .sh-title{text-align:center;font-weight:700;font-size:3.3cqw;padding-top:2.4cqw}
  .sh-off{text-align:center;font-size:2.8cqw;margin-top:1cqw}
  .sh-meta{font-size:2.8cqw;line-height:1.45;margin-top:1cqw;display:flex;justify-content:space-between;align-items:flex-end}
  .sh-meta .no{font-size:2.1cqw}
  .sh-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,52cqw);gap:3.8cqw;margin-top:3cqw}
  .sh-box{display:flex;flex-direction:column;min-height:0}
  .sh-img{flex:0 0 38cqw;position:relative}
  .sh-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .sh-lbl{text-align:center;font-weight:700;font-size:2.6cqw;margin-top:1.4cqw}
  .sh-cap{font-size:2.4cqw;margin-top:.8cqw;padding:0 2cqw;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .sh-foot{position:absolute;left:9.7cqw;right:9.7cqw;bottom:2.4cqw;border-top:1px solid #999;text-align:center;font-size:1.9cqw;padding-top:1.4cqw}
  .sidecol{display:flex;flex-direction:column;gap:14px}
  .next{border-color:#fcd9a8;background:#fffaf2}
  .next.ok{border-color:#bbf7d0;background:#f3fdf6}
  .next h2{display:flex;align-items:center;gap:8px}
  .next p{margin:0 0 12px;color:var(--muted)}
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .tl li:last-child{border-bottom:0}
  .tl .dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex:none;transform:translateY(-1px)}
  .tl .dot.g{background:var(--green)} .tl .dot.b{background:var(--blue)} .tl .dot.a{background:var(--amber)}
  .tl b{min-width:140px}
  .vthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
  .vthumbs .t{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#eef1f6;cursor:pointer}
  .vthumbs img{width:100%;height:100%;object-fit:cover}
  .vthumbs span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* pop-ups */
  .pop{border:0;padding:0;border-radius:14px;width:min(1100px,96vw);max-height:94vh;overflow:hidden;display:flex;flex-direction:column}
  .pop:not([open]){display:none}
  .pop-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
  .pop-head h3{margin:0;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pop-head .x{background:#f1f4f9;font-size:16px;padding:6px 12px}
  .viewer{background:#111;position:relative;display:flex;align-items:center;justify-content:center;height:min(70vh,760px)}
  .viewer img{max-width:100%;max-height:100%;object-fit:contain}
  .viewer .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);font-size:22px;width:48px;height:48px;border-radius:50%;padding:0}
  .viewer .nav:hover{background:#fff}
  .viewer .nav.l{left:12px} .viewer .nav.r{right:12px}
  .viewer .count{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:4px 12px;border-radius:999px}
  .vcap{padding:12px 16px;background:#fff;font-size:15px;min-height:46px}
  .vstrip{display:flex;gap:6px;padding:0 16px 14px;background:#fff;overflow-x:auto}
  .vstrip img{width:64px;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.55;border:2px solid transparent;flex:none}
  .vstrip img.on{opacity:1;border-color:var(--blue)}
  .pv-body{overflow:auto;background:#e5e9f0;padding:16px;flex:1}
  .pv-body .sheet{max-width:640px;margin:0 auto 16px}
  /* ===== Papan-style photos ===== */
  .thumbs{display:flex;flex-wrap:wrap;gap:10px}
  .th{position:relative;width:120px;height:120px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f1f5f9;cursor:pointer;flex:none}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .th .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(15,23,42,.65);color:#fff;font-size:10px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .th .num{position:absolute;top:4px;left:4px;background:rgba(255,255,255,.9);color:var(--ink);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
  .fref{font-weight:600;font-size:13px;margin:6px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fref .muted{font-weight:normal}
  .sm{padding:4px 9px;font-size:12px;border-radius:6px;font-weight:600}
  .btnlike{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px 14px;font-weight:600}
  .btnlike:hover{background:#f1f5f9}
  .etiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .etile{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;cursor:pointer}
  .etile:hover{border-color:#93c5fd;background:#f8fbff}
  .etile b{font-size:15px}
  .eic{font-size:34px;line-height:1}
  .crumbs{font-size:14px}
  .crumbs a{color:var(--blue);cursor:pointer}
  .crumbs a:hover{text-decoration:underline}
  .folds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .fold{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;cursor:pointer}
  .fold:hover{border-color:#93c5fd;background:#f8fbff}
  .fold.on{outline:2px solid var(--blue)}
  .fcover{width:64px;height:64px;border-radius:8px;overflow:hidden;background:#f1f5f9;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
  .fcover img{width:100%;height:100%;object-fit:cover}
  .fmeta{display:flex;flex-direction:column;gap:2px;font-size:12.5px;min-width:0}
  .fmeta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fmeta b{color:var(--red)}
  .attrow{display:flex;gap:10px;align-items:center;border:1px dashed #93c5fd;border-radius:10px;padding:8px;background:#f8fbff;margin-bottom:8px}
  .attrow .fmeta{flex:1}
  label.attrow{cursor:pointer}
  label.attrow input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--blue);cursor:pointer}
  label.attrow.on{border-style:solid;border-color:#86efac;background:#f0fdf4}
  .att-h{font-size:13px;font-weight:600;margin:4px 0 8px;color:var(--ink)}
  details.newph summary{cursor:pointer;color:var(--muted);margin:8px 0;list-style:none}
  details.newph summary::-webkit-details-marker{display:none}
  details.newph[open] summary{margin-bottom:10px}
  .fold.wait{border-style:dashed;border-color:#93c5fd;background:#f8fbff}
  .th .thx{position:absolute;top:3px;right:3px;background:rgba(255,255,255,.92);color:var(--red);border-radius:999px;width:22px;height:22px;padding:0;font-size:14px;line-height:22px}
  .bdg-w{color:#92400e;background:#fef3c7;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
  .bdg-ok{color:#166534;background:#dcfce7;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
  /* lightbox */
  #lb{position:fixed;inset:0;background:rgba(2,6,23,.88);z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
  #lb[hidden]{display:none}
  #lb img{max-width:100%;max-height:78vh;border-radius:6px;background:#fff}
  #lb .cap{color:#e2e8f0;font-size:13.5px;text-align:center;max-width:900px}
  #lb .lbbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #lb .lbbar button{background:#fff;color:var(--ink);border:1px solid #cbd5e1;padding:7px 14px}
  #lb .lbbar button.dan{color:var(--red);border-color:#fca5a5}
  .lbnav{position:absolute;top:50%;transform:translateY(-50%);font-size:44px;line-height:1;padding:6px 16px 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;border:none;z-index:2}
  .lbnav:hover{background:rgba(255,255,255,.35)}
  .lbprev{left:16px}.lbnext{right:16px}
  /* print photos dialog */
  #pdlg{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:160;display:flex;align-items:center;justify-content:center;padding:16px}
  #pdlg[hidden]{display:none}
  .pdbox{background:#fff;border-radius:12px;padding:18px 20px;width:100%;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .pdbox h3{margin:0 0 6px;font-size:16px;display:flex;gap:8px}
  .pdopts{display:flex;flex-wrap:wrap;gap:8px}
  .pdopts label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
  .pdopts label:has(input:checked){border-color:var(--blue);background:#eff6ff}
  @media (max-width:820px){ .th{width:96px;height:96px} .lbnav{font-size:34px;padding:4px 12px 8px} .lbprev{left:6px}.lbnext{right:6px} .etiles{grid-template-columns:repeat(2,minmax(0,1fr))} .etile{flex-direction:column;align-items:flex-start;gap:6px} .folds{grid-template-columns:minmax(0,1fr)} }
  /* print area */
  #print{display:none}
  @media print{
    @page{size:A4;margin:0}
    body{background:#fff;display:block}
    body > *:not(#print){display:none!important}
    #print{display:block}
    #print .sheet{width:210mm;height:297mm;box-shadow:none;margin:0;page-break-after:always;break-after:page}
    #print .sheet:last-child{page-break-after:auto;break-after:auto}
    @page port{size:A4 portrait;margin:0}
    @page land{size:A4 landscape;margin:0}
    #print .phs{box-sizing:border-box;padding:9mm;display:flex;flex-direction:column;gap:3mm;page-break-after:always;break-after:page;font-family:Arial,sans-serif;overflow:hidden}
    #print .phs:last-child{page-break-after:auto;break-after:auto}
    #print .phs.port{page:port;width:210mm;height:297mm}
    #print .phs.land{page:land;width:297mm;height:210mm}
    #print .phsh{display:flex;justify-content:space-between;font-size:9.5pt;border-bottom:1px solid #999;padding-bottom:1.5mm;flex:none}
    #print .phg{flex:1;display:grid;gap:4mm;min-height:0}
    #print .phg figure{margin:0;display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0;overflow:hidden}
    #print .phg img{flex:1;min-height:0;width:100%;object-fit:contain}
    #print .phg figcaption{font-size:9pt;color:#222;margin-top:1.5mm;text-align:center;flex:none}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  /* top bar user area */
  .role-badge{border:1.5px solid #fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:800;letter-spacing:.5px}
  .tb-user{font-size:14px;white-space:nowrap}
  .tb-btn{background:rgba(255,255,255,.15);color:#fff;font-size:13px;padding:6px 12px;white-space:nowrap}
  a.portal-link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;border-radius:8px;font-weight:600}
  .login-portal{position:absolute;top:16px;left:16px;color:#fff;background:rgba(255,255,255,.15);padding:8px 14px;font-size:14px}
  .login-portal:hover{background:rgba(255,255,255,.25)}
  body.is-off a.portal-link{display:none}
  .tb-btn:hover{background:rgba(255,255,255,.28)}
  .tb-btn.danger{background:#dc2626}
  .tb-btn.danger:hover{background:#b91c1c}
  @media (max-width:860px){ .tb-user,.role-badge,.tb-btn .tx{display:none} }
  .ph-body{padding:10px;display:flex;flex-direction:column;gap:6px}
  .ph-num{font-weight:700}
  .ph-count{font-size:11px;color:var(--muted);text-align:right}
  .ph-tools{display:flex;gap:4px}
  .selbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
  .selbar button:disabled{opacity:.45}
  .ph-sel{position:absolute;top:8px;left:8px;z-index:2;background:rgba(255,255,255,.95);border-radius:6px;padding:4px;display:flex;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .ph-sel input{width:20px;height:20px;accent-color:var(--blue);cursor:pointer;margin:0}
  .ph.sel{outline:3px solid var(--blue)}
  .ph-mv{width:100%;margin-top:4px;background:#f1f4f9;font-size:13px;padding:7px 0}
  .ph-mv:hover{background:var(--blue-l)}
  .ph-tools button{flex:1;padding:7px 0;background:#f1f4f9;font-size:14px}
  .ph-tools button:hover{background:var(--blue-l)}
  .ph-tools button.del:hover{background:#fdecec}
  .empty{color:var(--muted);text-align:center;padding:12px 0 0}
  .actions{position:sticky;bottom:-18px;background:rgba(247,248,251,.96);backdrop-filter:blur(6px);padding:12px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
  .actions .spacer{flex:1}
  #saveState{font-size:12px;color:var(--muted)}
  @media (max-width:640px){
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;bottom:-12px}
    .actions button{padding:9px 6px;font-size:13px}
    .actions .spacer{display:none}
    #saveState{grid-column:1/-1;text-align:center;order:-1}
  }

  /* Settings */
  .stabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:14px}
  .stabs button{background:transparent;border-radius:8px 8px 0 0;padding:10px 16px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}
  .stabs button:hover{color:var(--blue);background:#f3f6fb}
  .stabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
  .spane{display:none}
  .spane.on{display:block}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media (max-width:1000px){ .grid3{grid-template-columns:1fr} }
  .req::after,.reqmark{content:" *";color:var(--red);font-weight:700}
  .reqmark::after{content:none}
  .le-row .def{font-size:10px;font-weight:700;background:var(--blue-l);color:var(--blue);border-radius:999px;padding:2px 6px;flex:none}
  .set h3{margin:18px 0 10px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--blue)}
  .set h3:first-child{margin-top:0}
  .hint{font-size:12px;color:var(--muted);margin:4px 0 0}

  .userchip{background:rgba(255,255,255,.18);color:#fff;font-size:13px;padding:5px 12px;border-radius:999px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
  .userchip:hover{background:rgba(255,255,255,.3)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;min-height:42px;cursor:text}
  .chips:focus-within{outline:2px solid var(--blue);border-color:transparent}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-l);color:var(--blue);border:1px solid var(--blue-b);border-radius:999px;padding:3px 6px 3px 10px;font-size:14px;font-weight:600}
  .chip button{background:transparent;padding:0 4px;color:var(--blue);font-size:13px}
  .chip button:hover{color:var(--red)}
  .chips input{border:0;outline:0;flex:1;min-width:140px;padding:4px;background:transparent}
  .login{position:fixed;inset:0;background:linear-gradient(160deg,#1e40af,#1e3a8a);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
  .login[hidden]{display:none}
  .login-card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .login-card img{height:56px}
  .login-lang{float:right;border-color:var(--line)}
  .login-lang button{color:var(--muted)}
  .login-lang button.on{background:var(--blue);color:#fff}
  .login-card h2{margin:10px 0 2px;font-size:18px}
  .users{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:16px 0}
  .users button{background:#f3f6fb;border:1px solid var(--line);padding:14px 8px;font-size:15px}
  .users button:hover,.users button.sel{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
  .users button .lock{font-size:11px;color:var(--muted);display:block;font-weight:500}
  .login-row{display:flex;gap:8px;margin-top:10px}
  .login-card form{text-align:left;display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .login-card .err{color:var(--red);font-size:13px;min-height:18px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
  .le{display:flex;flex-direction:column;gap:6px}
  .le-row{display:flex;gap:6px;align-items:center}
  .le-row .no{width:24px;text-align:right;color:var(--muted);font-size:12px;flex:none}
  .le-row input{flex:1;min-width:0;padding:7px 10px}
  .le-row input.code{flex:0 0 90px;text-transform:uppercase}
  .le-row button{padding:6px 9px;background:#f1f4f9;font-size:13px;flex:none}
  .le-row button:hover{background:var(--blue-l)}
  .le-row button.del:hover{background:#fdecec;color:var(--red)}
  .le-add{display:flex;gap:6px;margin-top:6px}
  .le-add input{flex:1;min-width:0}
  .le-add input.code{flex:0 0 90px;text-transform:uppercase}
  .menu{position:fixed;top:56px;right:16px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:150;min-width:220px;padding:6px;display:none}
  .menu.open{display:block}
  .menu .who{padding:8px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .menu button{display:block;width:100%;text-align:left;background:transparent;font-weight:500;padding:9px 12px}
  .menu button:hover{background:var(--blue-l)}
  body.phone .tbl th:nth-child(4), body.phone .tbl td:nth-child(4),
  body.phone .tbl th:nth-child(7), body.phone .tbl td:nth-child(7),
  body.phone .tbl th:nth-child(8), body.phone .tbl td:nth-child(8){display:none}
  body.phone .tbl tr.sub td{display:table-cell!important}
  body.phone .bar{grid-template-columns:1fr 1fr}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:90vw}
  #toast.show{opacity:1}
  dialog{border:0;border-radius:14px;padding:0;max-width:94vw}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  .cam{background:#000;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .cam video{max-width:100%;max-height:65vh;border-radius:8px}
</style>
</head>
<body>

<div class="top">
  <button id="btnMenu">☰</button>
  <a class="tb-btn portal-link" href="../" title="MJSB Portal">← <span class="tx">Portal</span></a>
  <div class="logo"><img id="logoImg" alt="" src="logo.jpg" onerror="this.parentNode.style.display='none'"></div>
  <h1 id="appTitle">MASIH JAYA GROUP — LAWATAN LADANG</h1>
  <span id="netPill" class="pill">● Online</span>
  <span class="role-badge" id="tbRole"></span>
  <span class="tb-user"><span data-t="userLbl"></span>: <span id="userName"></span></span>
  <button class="tb-btn" id="tbPass">🔑 <span class="tx" data-t="changePassShort"></span></button>
  <button class="tb-btn" id="tbInstall" style="display:none">📲 <span class="tx" data-t="installApp"></span></button>
  <button class="tb-btn danger" id="tbLogout">⎋ <span class="tx" data-t="logoutShort"></span></button>
  <div class="lang"><button data-lang="ms">BM</button><button data-lang="en">EN</button></div>
</div>

<div class="shell">
  <nav class="side" id="side">
    <div class="sec" data-t="navMain"></div>
    <a data-nav="home">🏠 <span data-t="home"></span></a>
    <a data-nav="list">📋 <span data-t="visitList"></span> <span class="cnt" id="navPending" style="display:none"></span></a>
    <a data-nav="photos">📷 <span data-t="photos"></span></a>
    <a data-nav="report">📊 <span data-t="monthly"></span></a>
    <div class="sec" data-t="navSystem"></div>
    <a data-nav="settings">⚙️ <span data-t="settings"></span></a>
  </nav>

  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div class="content" id="content">

      <!-- HOME -->
      <section class="page" id="pg-home">
        <div class="stats">
          <div class="stat"><div class="n" id="stVisits">0</div><div class="l" data-t="stVisits"></div></div>
          <div class="stat"><div class="n" id="stPhotos">0</div><div class="l" data-t="stPhotos"></div></div>
          <div class="stat"><div class="n" id="stEstates">0</div><div class="l" data-t="stEstates"></div></div>
          <div class="stat warn"><div class="n" id="stPending">0</div><div class="l" data-t="stPending"></div></div>
        </div>
        <div class="row-actions" style="margin-bottom:12px">
          <button class="btn-ghost" data-go="list" data-t="viewAll"></button>
          <button class="btn-ghost" id="btnSyncNow" data-t="syncNow"></button>
        </div>
        <div class="card">
          <h2 data-t="recent"></h2>
          <div class="tblwrap"><table class="tbl" id="tblRecent"></table></div>
        </div>
      </section>

      <!-- LIST -->
      <section class="page" id="pg-list">
        <div style="display:flex;gap:10px"><input class="f-in" id="lSearch" type="search" data-tp="searchAll" style="flex:1"><button class="btn" data-go="new" data-t="newVisitBtn" style="white-space:nowrap"></button></div>
        <div class="bar">
          <div><label class="f" data-t="month"></label><select class="f-in" id="lMonth"></select></div>
          <div><label class="f" data-t="estate"></label><select class="f-in" id="lEstate"></select></div>
          <div><label class="f" data-t="cCreated"></label><select class="f-in" id="lOfficer"></select></div>
          <div><label class="f" data-t="status"></label><select class="f-in" id="lStatus"></select></div>
        </div>
        <div class="tblwrap"><table class="tbl" id="tblList"></table></div>
        <div class="foot" id="lFoot"></div>
      </section>

      <!-- PHOTOS -->
      <section class="page" id="pg-photos">
        <div class="row-actions" style="margin-bottom:12px">
          <span class="crumbs" id="phCrumbs"></span>
          <select class="f-in" id="gShow" style="width:auto"></select>
          <span style="flex:1"></span>
          <button class="btn" id="phNew"></button>
        </div>
        <input type="file" id="fPickF" accept="image/*" multiple hidden>
        <input type="file" id="fCamF" accept="image/*" capture="environment" hidden>
        <div id="phMsg"></div>
        <div id="phPanel"></div>
        <div class="card" id="phMain"></div>
      </section>

      <!-- NEW PHOTO FOLDER -->
      <section class="page" id="pg-newfolder">
        <div class="card" style="border-color:#93c5fd">
          <div class="row-actions" style="margin-bottom:12px"><h2 style="margin:0">📷 <span data-t="newFolderTab"></span></h2><span style="flex:1"></span><button class="btn-ghost" id="nfCancel" data-t="cancel"></button></div>
          <div class="grid2">
            <div><label class="f req" data-t="estate"></label><select class="f-in" id="nfEstate"></select></div>
            <div><label class="f" data-t="folderRef"></label><input class="f-in" id="nfRef" style="text-transform:uppercase"></div>
            <div style="grid-column:1/-1"><label class="f" data-t="noteOpt"></label><input class="f-in" id="nfNote" data-tp="nfNotePh"></div>
          </div>
          <div class="row-actions" style="margin-top:14px">
            <button class="btnlike" id="nfCam" data-t="takePhoto"></button>
            <button class="btnlike" id="nfPick" data-t="uploadPhotos"></button>
            <input type="file" id="nfPickIn" accept="image/*" multiple hidden>
            <input type="file" id="nfCamIn" accept="image/*" capture="environment" hidden>
          </div>
          <div class="thumbs" id="nfThumbs" style="margin-top:12px"></div>
          <div style="margin-top:14px"><button class="btn" id="nfSave"></button></div>
        </div>
      </section>

      <!-- REPORT -->
      <section class="page" id="pg-report">
        <div class="bar" style="align-items:end">
          <div><label class="f" data-t="month"></label><select class="f-in" id="rMonth"></select></div>
          <div class="row-actions">
            <button class="btn" id="btnRepPdf">📄 PDF</button>
            <button class="btn-ghost" id="btnRepCsv">📗 Excel (CSV)</button>
          </div>
        </div>
        <div class="stats" id="rStats"></div>
        <div class="card" style="margin-bottom:16px"><h2 data-t="byEstate"></h2><div class="tblwrap"><table class="tbl" id="tblRepEstate"></table></div></div>
        <div class="card"><h2 data-t="byOfficer"></h2><div class="tblwrap"><table class="tbl" id="tblRepOfficer"></table></div></div>
      </section>

      <!-- SETTINGS -->
      <section class="page set" id="pg-settings">
        <div class="stabs" id="stabs">
          <button data-st="general" data-t="setGeneral"></button>
          <button data-st="pdf" data-t="setReport"></button>
          <button data-st="lists" data-t="setLists"></button>
          <button data-st="users" data-t="setUsers"></button>
          <button data-st="sync">Google Drive Sync</button>
          <button data-st="backup" data-t="setBackup"></button>
        </div>
        <div class="card">
          <div class="spane" data-sp="general">
            <div class="grid2">
              <div><label class="f req" data-t="setCompany"></label><input class="f-in" id="sCompany"></div>
              <div><label class="f" data-t="setRemember"></label><select class="f-in" id="sRemember"><option value="yes" data-t="remYes"></option><option value="no" data-t="remNo"></option></select></div>
            </div>
            <div style="margin-top:14px">
              <label class="f" data-t="setLogo"></label>
              <div class="row-actions">
                <img id="setLogoPrev" style="height:40px;display:none">
                <button type="button" class="btn-ghost" id="btnLogo" data-t="pickLogo"></button>
                <button type="button" class="btn-ghost" id="btnLogoReset" data-t="useLogoFile"></button>
                <input type="file" id="logoPick" accept="image/*" hidden>
              </div>
              <p class="hint" data-t="logoHint"></p>
            </div>
          </div>

          <div class="spane" data-sp="pdf">
            <div class="grid2">
              <div><label class="f" data-t="setRev"></label><input class="f-in" id="sRev"></div>
              <div><label class="f" data-t="setHeader"></label>
                <select class="f-in" id="sHeader"><option value="all" data-t="hdrAll"></option><option value="first" data-t="hdrFirst"></option></select></div>
              <div><label class="f" data-t="setPdfLang"></label>
                <select class="f-in" id="sPdfLang"><option value="ms">Bahasa Melayu</option><option value="en">English</option></select></div>
            </div>
          </div>

          <div class="spane" data-sp="lists">
            <div class="grid2">
              <div><label class="f" data-t="setTitles"></label><div class="le" id="leTit"></div>
                <div class="le-add"><input class="f-in" id="addTitName" data-tp="titNamePh"><button class="btn" id="addTit">+</button></div>
                <p class="hint" data-t="setTitlesHint"></p></div>
              <div><label class="f" data-t="setEstates"></label><div class="le" id="leEst"></div>
                <div class="le-add"><input class="f-in" id="addEstName" data-tp="estNamePh"><button class="btn" id="addEst">+</button></div>
                <p class="hint" data-t="estatesHint"></p></div>
            </div>
          </div>

          <div class="spane" data-sp="users">
            <div class="tblwrap"><table class="tbl" id="tblUsers"></table></div>
            <div class="grid2" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
              <div><label class="f req" data-t="username"></label><input class="f-in" id="nuUser" autocomplete="off"></div>
              <div><label class="f req" data-t="fullName"></label><input class="f-in" id="nuName" autocomplete="off"></div>
              <div><label class="f req" data-t="password"></label><input class="f-in" id="nuPass" type="password" autocomplete="new-password"></div>
              <div><label class="f" data-t="docCode"></label><input class="f-in" id="nuCode" maxlength="6" style="text-transform:uppercase" data-tp="docCodePh"></div>
              <div><label class="f" data-t="role"></label><select class="f-in" id="nuRole"><option value="staff" data-t="roleStaff"></option><option value="admin" data-t="roleAdmin"></option></select></div>
              <div style="display:flex;align-items:end"><button class="btn" id="nuAdd" style="width:100%" data-t="addUser"></button></div>
            </div>
            <p class="hint" data-t="usersHint"></p>
          </div>

          <div class="spane" data-sp="sync">
            <div class="grid2">
              <div><label class="f" data-t="setSyncUrl"></label><input class="f-in" id="syncUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
              <div><label class="f" data-t="setSyncKey"></label><input class="f-in" id="syncKey"></div>
            </div>
            <p class="hint" data-t="syncHint"></p>
            <div style="margin-top:12px"><button class="btn-ghost" id="btnTestSync" data-t="testSync"></button></div>
          </div>

          <div class="spane" data-sp="backup">
            <p class="hint" style="margin-top:0" data-t="bkIntro"></p>
            <div class="row-actions" style="flex-wrap:wrap;gap:10px;margin:12px 0 18px">
              <button class="btn" id="bkData">⬇ <span data-t="bkData"></span></button>
              <button class="btn-ghost" id="bkFull">⬇ <span data-t="bkFull"></span></button>
            </div>
            <p class="hint" data-t="bkHintDl"></p>
            <div style="border-top:1px solid var(--line);margin:18px 0 12px"></div>
            <button class="btn-ghost" id="bkRestore">⬆ <span data-t="bkRestore"></span></button>
            <input type="file" id="bkFile" accept=".json,application/json" hidden>
            <p class="hint" data-t="bkHintRs"></p>
            <p class="hint" id="bkLast"></p>
          </div>

          <div class="row-actions" style="margin-top:20px;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px">
            <span class="muted small"><span class="reqmark">*</span> <span data-t="reqNote"></span></span>
            <button class="btn" id="btnSaveSettings" data-t="save"></button>
          </div>
        </div>
      </section>

      <!-- DOC EDITOR -->
      <section class="page" id="pg-doc">
        <div class="doc-bar">
          <span class="badge" id="dBadge"></span>
          <span class="dn" id="dDocNo"></span><b id="dTitle"></b>
          <span class="muted small" id="dCreated"></span>
          <span class="spacer"></span>
          <span id="saveState" class="muted small"></span>
          <button class="btn-ghost" id="btnEdit"></button>
          <button class="btn" id="btnPdf"></button>
          <button class="btn-ghost" id="btnPdfDl"></button>
          <button class="btn-danger" id="btnDelVisit" data-t="delVisit"></button>
        </div>

        <!-- VIEW MODE -->
        <div class="docview" id="docView">
          <div class="sheets" id="sheets"></div>
          <div class="sidecol">
            <div class="card"><h2>🕒 <span data-t="timeline"></span></h2><ul class="tl" id="timeline"></ul></div>
            <div class="card">
              <h2>🖼 <span data-t="photos"></span> <small class="muted" id="vCount"></small></h2>
              <div class="row-actions">
                <button class="btnlike" id="vCam" data-t="takePhoto"></button>
                <button class="btnlike" id="vPick" data-t="uploadPhotos"></button>
                <button class="btn-ghost" id="btnDlAll" data-t="dlAll" style="display:none"></button>
              </div>
              <div id="vAttach"></div>
              <div class="vthumbs" id="vThumbs"></div>
            </div>
          </div>
        </div>

        <!-- EDIT MODE -->
        <div class="edcol" id="docEdit">
          <div class="card">
            <h2 data-t="secA"></h2>
            <div class="grid2">
              <div><label class="f req" for="title" data-t="reportTitle"></label><select class="f-in" id="title"></select></div>
              <div><label class="f req" for="tarikh" data-t="date"></label><input class="f-in" type="date" id="tarikh"></div>
              <div><label class="f req" for="ladang" data-t="estate"></label>
                <select class="f-in" id="ladang"></select><datalist id="dlEstates"></datalist></div>
              <div style="display:none"><label class="f req" for="pegawai" data-t="officers"></label>
                <div class="f-in chips" id="offBox"><span id="offChips" style="display:contents"></span><input id="pegawai" list="dlOfficers" data-tp="officerPh" autocomplete="off"></div>

/* ---------- IndexedDB ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('lawatan-ladang', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('visits', { keyPath: 'id' });
        d.createObjectStore('photos', { keyPath: 'id' });
        d.createObjectStore('settings');
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  get: (s, k) => DB.tx(s, 'readonly', st => st.get(k)),
  all: s => DB.tx(s, 'readonly', st => st.getAll()),
  put: (s, v, k) => { if (s === 'photos' && v.blob === PH_BLOB) v = { ...v, blob: null }; return DB.tx(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)); },
  del: (s, k) => DB.tx(s, 'readwrite', st => st.delete(k)),
};

const fmtShort = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; };

/* ---------- Estates & doc numbers ---------- */
const estName = line => line.split('=')[0].trim();
const estateNames = () => settings.estates.map(estName);
function estCode(name) {
  const n = (name || '').trim().toLowerCase();
  const line = settings.estates.find(l => estName(l).toLowerCase() === n && l.includes('='));
  if (line) return line.split('=')[1].trim().toUpperCase();
  const w = (name || '').toUpperCase().replace(/^LADANG\s+/, '').replace(/[^A-Z]/g, '');
  return 'L' + (w.slice(0, 2) || 'XX');
}
function nameCode(name) {
  const w = (name || '').toUpperCase().replace(/[^A-Z ]/g, '').split(/\s+/).filter(x => x && !['BIN', 'BINTI', 'BT', 'B', 'A/L', 'A/P'].includes(x));
  if (!w.length) return 'X';
  return w.length === 1 ? w[0].slice(0, 3) : w.slice(0, 3).map(x => x[0]).join('');
}
function userCode(v) {
  const u = settings.users.find(x => x.u === v.createdByU) || settings.users.find(x => x.name === v.createdBy);
  return (u?.code || nameCode(u?.name || v.createdBy)).toUpperCase();
}
function assignDocNo(v) {
  if (!v.tarikh) return;
  const code = userCode(v), ym = monthOf(v), mm = String(+ym.slice(5, 7));
  const used = visits.filter(x => x.id !== v.id && !x.unsaved && x.docNo && monthOf(x) === ym && x.docNo.startsWith(code + '-'))
    .map(x => parseInt(x.docNo.split('-')[1], 10) || 0);
  const want = `${code}-`;
  if (v.docNo && v.docNo.startsWith(want) && v.docNo.endsWith('/' + mm) && !used.includes(parseInt(v.docNo.split('-')[1], 10))) return;
  v.docNo = `${code}-${(used.length ? Math.max(...used) : 0) + 1}/${mm}`;
}
const docLabel = v => v.unsaved ? estDocNo(v) + ' ' + T('est') : (v.docNo || T('draftNo'));
const savedV = () => visits.filter(v => !v.unsaved);
function estDocNo(v) { const c = { ...v, docNo: '' }; assignDocNo(c); return c.docNo; }

const offName = line => line.split('=')[0].trim();
const officerNames = () => settings.users.map(u => u.name);
const offsOf = v => v.officers || (v.pegawai ? v.pegawai.split(/\s*,\s*/).filter(Boolean) : []);
function setOfficers(v, arr) { v.officers = [...new Set(arr.map(x => x.trim().toUpperCase()).filter(Boolean))]; v.pegawai = v.officers.join(', '); }

function learn(v) {
  let ch = false;
  const addTo = (key, x, names) => {
    x = (x || '').trim();
    if (x && !names.some(a => a.toLowerCase() === x.toLowerCase())) { settings[key].push(x); ch = true; }
  };
  addTo('estates', v.ladang, estateNames());
  if (ch) { saveSettings(); fillDatalists(); }
}
function fillDatalists() {
  const fill = (dl, arr) => { dl.innerHTML = ''; arr.forEach(v => { const o = document.createElement('option'); o.value = v; dl.appendChild(o); }); };
  fill($('dlEstates'), estateNames()); fill($('dlOfficers'), officerNames());
  fillEstateSelect();
}
function fillEstateSelect() {
  const sel = $('ladang'); if (!sel) return;
  const val = cur?.ladang || '', names = estateNames();
  if (val && !names.includes(val)) names.unshift(val);
  sel.innerHTML = `<option value="">${esc(T('chooseEstate'))}</option>` + names.map(n => `<option ${n === val ? 'selected' : ''}>${esc(n)}</option>`).join('') + `<option value="__new">${esc(T('newEstate'))}</option>`;

}

function tabLabel(k) {
  if (k.startsWith('doc:')) { const v = visits.find(x => x.id === k.slice(4)); return !v ? 'Doc' : v.unsaved ? `✚ ${T('newVisitTab')}${v.ladang ? ' · ' + v.ladang : ''}` : `Doc ${docLabel(v)} · ${v.ladang || T('noEstate')}`; }
  return T(PAGE_LABEL[k]);
}
function renderTabs() {
  const el = $('tabs'); el.innerHTML = '';
  tabs.forEach(k => {
    const t = document.createElement('div'); t.className = 'tab' + (k === active ? ' on' : '');
    const s = document.createElement('span'); s.textContent = tabLabel(k);
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕'; x.title = 'Close';
    x.onclick = e => { e.stopPropagation(); closeTab(k); };
    t.onclick = () => go(k);
    t.append(s, x); el.appendChild(t);
  });
  document.querySelectorAll('.side a').forEach(a => a.classList.toggle('on', a.dataset.nav === active));
  localStorage.setItem('ll.tabs', JSON.stringify({ tabs, active }));
}
async function go(k) {
  if (k === 'new') return createVisit();
  if (k === 'settings' && me && me.role !== 'admin') k = 'home';
  if (isPhone && !PHONE_OK(k)) k = 'photos';
  if (k.startsWith('doc:') && !visits.some(v => v.id === k.slice(4))) k = 'list';
  await flushSave();
  if (!tabs.includes(k)) tabs.push(k);
  active = k;

async function closeTab(k) {

async function getPhoto(pid) {

/* ---------- Monthly report ---------- */
function reportData(ym) {
  const mv = savedV().filter(v => monthOf(v) === ym).sort((a, b) => (a.docNo || '').localeCompare(b.docNo || '', undefined, { numeric: true }));
  const group = key => {
    const m = new Map();
    mv.forEach(v => {
      const keys = key === 'ladang' ? [v.ladang || '-'] : [v.createdBy || '-'];
      keys.forEach(k => {
        if (!m.has(k)) m.set(k, { name: k, visits: 0, photos: 0, other: new Set(), docs: [] });
        const r = m.get(k); r.visits++; r.photos += v.photoIds.length;
        (key === 'ladang' ? [v.createdBy] : [v.ladang]).forEach(o => o && r.other.add(o)); r.docs.push(docLabel(v));
      });
    });
    return [...m.values()].sort((a, b) => a.name.localeCompare(b.name));
  };
  return { mv, est: group('ladang'), off: group('pegawai') };
}

    [...est.map(r => [r.name, r.visits, r.photos, [...r.other].join(', '), r.docs.join(', ')]), totRow], [totRow]);
  sec(T('byOfficer'));
  drawTable([T('cOfficer'), T('cVisits'), T('cPhotos'), T('cEstate'), T('cDocs')], [45, 18, 18, 49, 50],
    off.map(r => [r.name, r.visits, r.photos, [...r.other].join(', '), r.docs.join(', ')]));
  sec(T('visitList'));
  drawTable([T('cDoc'), T('cDate'), T('cEstate'), T('cTitle'), T('cOfficer'), T('cPhotos')], [24, 22, 38, 40, 40, 16],
    mv.map(v => [docLabel(v), fmtDate(v.tarikh), v.ladang, v.title, v.pegawai, v.photoIds.length]));
  const total = doc.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    doc.setPage(p); doc.setFont('Helvetica', 'normal'); doc.setFontSize(8); doc.setDrawColor(150);
    doc.line(M, H - 12, W - M, H - 12);
    const ft = PDF_STR[settings.pdfLang].page(p, total); doc.text(ft, (W - doc.getTextWidth(ft)) / 2, H - 6);
  }

};

async function shrink(file, max = 1600, q = 0.85) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', q));
}

}

const blobToDataURL = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
async function pdfImage(blob, max = 1100) {
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return { data: c.toDataURL('image/jpeg', 0.8), w: c.width, h: c.height };
}

async function buildPDF(v) {
  const L = PDF_STR[settings.pdfLang];
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const M = 20.4, boxW = 90, boxH = 110, gap = 8, imgMax = 80;
  const xOff = (W - (2 * boxW + gap)) / 2;
  const firstOnly = settings.header === 'first';
  const topWithHeader = M + 28, topNoHeader = M - 4;
  const title = v.title || settings.titles[0] || 'LAWATAN LADANG';
  const logo = await getLogo();
  let logoProps = null;
  if (logo) { try { logoProps = doc.getImageProperties(logo); } catch { logoProps = null; } }

  for (let i = 0; i < v.photoIds.length; i++) {
    const slot = i % 4, pageNo = Math.floor(i / 4) + 1;
    if (i > 0 && slot === 0) doc.addPage();
    const top = (!firstOnly || pageNo === 1) ? topWithHeader : topNoHeader;
    const col = slot % 2, row = Math.floor(slot / 2);
    const x = xOff + col * (boxW + gap), y = top + row * (boxH + gap);
    const p = await getPhoto(v.photoIds[i]);
    const im = await pdfImage(p.blob);
    const ar = im.w / im.h;
    let iw = boxW - 10, ih = iw / ar;
    if (ih > imgMax) { ih = imgMax; iw = ih * ar; }
    doc.addImage(im.data, 'JPEG', x + (boxW - iw) / 2, y + (imgMax - ih) / 2, iw, ih);
    doc.setFont('Helvetica', 'bold'); doc.setFontSize(11);
    const label = `${L.photo} ${i + 1}`;
    doc.text(label, x + (boxW - doc.getTextWidth(label)) / 2, y + imgMax + 7);
    if (p.caption) {
      doc.setFont('Helvetica', 'normal'); doc.setFontSize(10.5);
      let ln = doc.splitTextToSize(p.caption, boxW - 10);
      if (ln.length > 3) { ln = ln.slice(0, 3); ln[2] = ln[2].replace(/.{0,3}$/, '...'); }
      doc.text(ln, x + 5, y + imgMax + 13);
    }
  }
  const total = doc.getNumberOfPages();
  for (let pg = 1; pg <= total; pg++) {
    doc.setPage(pg);
    if (pg === 1 || !firstOnly) {
      if (logo && logoProps) {
        const s = Math.min(25 / logoProps.width, 25 / logoProps.height);
        doc.addImage(logo, logoProps.fileType || 'JPEG', M, M - 10, logoProps.width * s, logoProps.height * s);
      }
      doc.setFont('Helvetica', 'normal'); doc.setFontSize(7);
      doc.text(settings.rev, W - M - doc.getTextWidth(settings.rev), M - 5);
      if (v.docNo) { const dn = `No: ${v.docNo}`; doc.setFontSize(9); doc.text(dn, W - M - doc.getTextWidth(dn), M + 22); }
      doc.setFont('Helvetica', 'bold'); doc.setFontSize(14);
      doc.text(title, (W - doc.getTextWidth(title)) / 2, M);
      doc.setFont('Helvetica', 'normal'); doc.setFontSize(12);
      const offTxt = offsOf(v).join(', ');
      let fs = 12; doc.setFontSize(fs);
      while (doc.getTextWidth(offTxt) > W - 2 * M - 56 && fs > 7) doc.setFontSize(--fs);
      doc.text(offTxt, (W - doc.getTextWidth(offTxt)) / 2, M + 8);
      doc.setFontSize(12);
      doc.text(`${L.loc}: ${v.ladang}`, M, M + 16);
      doc.text(`${L.date}: ${fmtDate(v.tarikh)}`, M, M + 22);
    }
    doc.setFont('Helvetica', 'normal'); doc.setFontSize(8); doc.setDrawColor(150);
    doc.line(M, H - 12, W - M, H - 12);
    const ft = L.page(pg, total);
    doc.text(ft, (W - doc.getTextWidth(ft)) / 2, H - 6);
    if (firstOnly && pg > 1) {
      doc.setFontSize(7);
      doc.text(`${v.docNo ? v.docNo + ' · ' : ''}${title} · ${v.ladang} · ${fmtDate(v.tarikh)}`, M, H - 14);
    }
  }
  return doc;
}

async function post(body) {
  const r = await fetch(settings.syncUrl, { method: 'POST', body: JSON.stringify({ key: settings.syncKey, ...body }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Server error');
  return j;
}
const b64 = async blob => (await blobToDataURL(blob)).split(',')[1];
const textB64 = s => btoa(unescape(encodeURIComponent(s)));
function queueTrash(id) { (settings.trashQ ||= []).push(id); saveSettings(); }
async function syncFolder(f) {
  const L = PDF_STR[settings.pdfLang];
  const base = { visitId: f.id, folderName: `WAITING ${f.ladang} ${f.docNo}`.replace(/\//g, '-') };
  const keep = [];
  const info = `Photo folder (waiting to attach)\nRef: ${f.docNo}\n${L.loc}: ${f.ladang}\nNote: ${f.note || '-'}\nBy: ${f.createdBy || '-'} (${fmtStamp(f.createdAt)})\n`;
  await post({ ...base, action: 'file', name: 'info.txt', mime: 'text/plain', data: textB64(info) }); keep.push('info.txt');
  for (let i = 0; i < f.photoIds.length; i++) {
    const p = await getPhoto(f.photoIds[i]); if (!p) continue;
    const name = `${L.photo}_${String(i + 1).padStart(2, '0')}.jpg`;
    await post({ ...base, action: 'file', name, mime: 'image/jpeg', data: await b64(p.blob) }); keep.push(name);
  }
  await post({ ...base, action: 'cleanup', keep });
}
async function syncVisit(v) {
  const L = PDF_STR[settings.pdfLang];
  const folderName = `${v.tarikh} ${v.docNo || ''} ${v.ladang || 'Estate'} - ${v.pegawai || ''} (${v.id.slice(-4)})`.replace(/\s+/g, ' ');
  const base = { visitId: v.id, folderName };
  const keep = [], photos = [];
  for (const pid of v.photoIds) photos.push(await getPhoto(pid));
  let info = `${v.title}\n${settings.rev}\nNo: ${v.docNo || '-'}\n\n${L.date}: ${fmtDate(v.tarikh)}\nOfficer/Pegawai: ${v.pegawai}\n${L.loc}: ${v.ladang}\n${v.note ? 'Note: ' + v.note + '\n' : ''}Created by: ${v.createdBy || '-'} (${fmtStamp(v.createdAt)})\n\n`;
  photos.forEach((p, i) => info += `${L.photo} ${i + 1}: ${p.caption || '-'}\n`);
  await post({ ...base, action: 'file', name: 'info.txt', mime: 'text/plain', data: textB64(info) }); keep.push('info.txt');
  for (let i = 0; i < photos.length; i++) {
    const name = `${L.photo}_${String(i + 1).padStart(2, '0')}.jpg`;
    await post({ ...base, action: 'file', name, mime: 'image/jpeg', data: await b64(photos[i].blob) }); keep.push(name);
  }
  if (window.jspdf && v.ladang && v.pegawai) {
    const doc = await buildPDF(v), name = pdfName(v);
    await post({ ...base, action: 'file', name, mime: 'application/pdf', data: await b64(doc.output('blob')) }); keep.push(name);
  }
  await post({ ...base, action: 'cleanup', keep });
}
async function syncAll(manual = false) {
  if (syncing) return;
  if (!settings.syncUrl) { if (manual) toast(T('noSyncSet')); return; }
  if (!navigator.onLine) { if (manual) toast(T('noNet')); return; }
  await flushSave();
  const ready = x => x.status === 'pending' && (manual || Date.now() - (x.updatedAt || 0) > 120000);   // wait 2 min after the last edit
  const todo = [...savedV().filter(ready), ...folders.filter(ready)].filter(canEdit), trash = [...(settings.trashQ || [])];
  if (!todo.length && !trash.length) { if (manual) toast(T('allSynced')); return; }
  syncing = true; updateNet();
  let ok = 0;
  try { for (const id of trash) { await post({ action: 'trash', visitId: id }); settings.trashQ = settings.trashQ.filter(x => x !== id); } await saveSettings(); }
  catch (e) { syncing = false; updateNet(); toast(T('syncFail', e.message), 4000); return; }
  for (const v of todo) {
    if (v.isFolder) {
      const stamp = v.updatedAt;
      try { await syncFolder(v); if (v.updatedAt === stamp && folders.includes(v)) { v.status = 'synced'; v.syncedAt = Date.now(); await saveFolders(); } ok++; }
      catch (e) { toast(T('syncFail', e.message), 4000); break; }
      continue;
    }
    const stamp = v.updatedAt;
    try {
      await syncVisit(v);
      if (v.updatedAt === stamp) { v.status = 'synced'; v.syncedAt = Date.now(); logEv(v, 'synced'); await DB.put('visits', v); }
      ok++;
    } catch (e) { toast(T('syncFail', e.message), 4000); break; }
  }
  syncing = false; updateNet(); refreshActive();
  if (ok) toast(T('syncOk', ok));
}
function updateNet() {
  const p = $('netPill'), pend = savedV().filter(v => v.status === 'pending').length + folders.filter(f => f.status === 'pending').length;
  const w = pend ? ' · ' + T('waiting', pend) : '';
  if (!navigator.onLine) { p.className = 'pill off'; p.textContent = `● ${T('offline')}${w}`; }
  else if (syncing) { p.className = 'pill'; p.textContent = T('syncingNow'); }
  else { p.className = 'pill'; p.textContent = `● ${T('online')}${w}`; }
  if (cloudOn() && cloudPending) p.textContent += ` · ☁ ${cloudPending}`;
  const np = $('navPending'), nd = savedV().filter(v => v.status !== 'synced').length;
  np.style.display = nd ? '' : 'none'; np.textContent = nd;
}

/* ---------- Backup (.json) ---------- */
async function makeBackup(withPhotos) {
  toast(T('bkMaking'));
  const photos = [];
  for (const p of await DB.all('photos')) {
    const o = { id: p.id, visitId: p.visitId, caption: p.caption || '', at: p.at || 0, by: p.by || '' };
    if (withPhotos && p.blob && p.blob !== PH_BLOB) { o.mime = p.blob.type || 'image/jpeg'; o.data = await b64(p.blob); }
    photos.push(o);
  }
  const data = { app: 'site-visit', version: 1, createdAt: new Date().toISOString(), by: me?.u || '',
    visits: visits.filter(v => !v.unsaved).map(clean), folders: folders.map(clean),
    settings: clean(settings), photos, drive: { ...cloud.drive } };
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const name = `site-visit-backup-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}${withPhotos ? '-with-photos' : ''}.json`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  localStorage.setItem('ll.lastBackup', Date.now()); showSetTab('backup'); toast(T('bkDone'));
}
async function restoreBackup(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { d = null; }
  if (!d || d.app !== 'site-visit' || !Array.isArray(d.visits)) return toast(T('bkBad'), 4000);
  if (!confirm(T('bkAsk', d.visits.length, (d.folders || []).length, (d.photos || []).length))) return;
  const now = Date.now(); let nv = 0, nf = 0, np = 0;
  for (const v of d.visits) {             // add missing, or replace with the backup copy if it is newer
    const ex = visits.find(x => x.id === v.id);
    if (ex && (ex.updatedAt || 0) >= (v.updatedAt || 0)) continue;
    const nv2 = { ...v, updatedAt: now };
    if (ex) { Object.keys(ex).forEach(k => delete ex[k]); Object.assign(ex, nv2); await DB.put('visits', ex); }
    else { visits.push(nv2); await DB.put('visits', nv2); learn(nv2); }
    nv++;
  }
  for (const f of d.folders || []) {
    const ex = folders.find(x => x.id === f.id);
    if (ex && (ex.updatedAt || 0) >= (f.updatedAt || 0)) continue;
    if (ex) { Object.keys(ex).forEach(k => delete ex[k]); Object.assign(ex, f, { updatedAt: now }); } else folders.push({ ...f, updatedAt: now });
    nf++;
  }
  Object.entries(d.drive || {}).forEach(([k, v]) => { if (!cloud.drive[k]) cloud.drive[k] = v; });
  for (const p of d.photos || []) {
    const ex = await DB.get('photos', p.id);
    let blob = null;
    if (p.data) { const bin = atob(p.data), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); blob = new Blob([a], { type: p.mime || 'image/jpeg' }); }
    if (ex && (ex.blob || !blob)) continue;
    await DB.put('photos', { id: p.id, visitId: p.visitId, caption: p.caption, at: p.at, by: p.by, blob: blob || ex?.blob || null });
    delete photoCache[p.id]; np++;
  }
  const bs = d.settings || {};
  for (const u of bs.users || []) if (!findUser(u.u)) { settings.users.push({ ...u, _pw: 1 }); }
  SHARED_KEYS.forEach(k => { if ((settings[k] == null || settings[k] === '' || (Array.isArray(settings[k]) && !settings[k].length)) && bs[k] != null) settings[k] = bs[k]; });
  visits.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  await saveCloud(); await saveFolders(); await saveSettings();
  updateNet(); refreshActive(); scheduleCloud(1500); if (typeof downloadMissingPhotos === 'function' && cloudOn()) downloadMissingPhotos();
  toast(T('bkRestored', nv, nf, np), 5000);
}

let me = null;   // { u, name, role }
const meName = () => me?.name || '';
async function hashPw(pw, salt) {
  const data = new TextEncoder().encode(salt + ':' + pw);
  if (crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const b of data) h = ((h << 5) + h + b) >>> 0; return 'x' + h.toString(16);   // fallback
}
const newSalt = () => [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, '0')).join('');
const findUser = u => settings.users.find(x => x.u === u.trim().toLowerCase());

    const ci = tr.querySelector('.ucode'); ci.value = u.code || nameCode(u.name);
    ci.onchange = async () => { u.code = ci.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '') || nameCode(u.name); await saveSettings(); renderUsers(); };
    tr.onclick = async e => {
      const a = e.target.closest('button')?.dataset.a; if (!a) return;
